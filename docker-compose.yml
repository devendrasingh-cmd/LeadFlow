services:

  backend:
    build:
      context: ./backend
    container_name: leadflow-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: leadflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
